[project]
name = "inkfish"
version = "0.1.0"
description = "Pinch-zoom and pan desktop text editor for .txt, .md, and .html."
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.6",
]

[project.scripts]
inkfish = "inkfish.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkfish"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
]

[tool.pytest.ini_options]
qt_api = "pyqt6"
testpaths = ["tests"]
